name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore PlaywrightPOC/PlaywrightPOC.csproj

      - name: Build
        run: dotnet build PlaywrightPOC/PlaywrightPOC.csproj --no-restore

      - name: Install Playwright browsers
        run: pwsh PlaywrightPOC/bin/Debug/net8.0/playwright.ps1 install --with-deps

      - name: Run Playwright tests
        run: dotnet test PlaywrightPOC/PlaywrightPOC.csproj --no-build --settings PlaywrightPOC/playwright.runsettings --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            **/TestResults/
            **/screenshots/
          retention-days: 14
